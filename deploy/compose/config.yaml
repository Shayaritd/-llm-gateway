redis:
  url: "redis://localhost:6379/0"

admins:
  - name: "platform-admin"
    api_key: "sk-admin-demo-key"

teams:
  - name: team-a
    api_key: "sk-team-a-demo-key"
    allowed_models: ["gemini-3.6-flash", "gemini-3.5-flash", "gemini-3.5-pro", "gpt-4o-mini", "claude-3-5-sonnet"]
    allowed_providers: ["gemini", "openai", "anthropic"]
    policy:
      system_prompt: "You are Team A's assistant. Always answer concisely."
      disclaimer: "This response was generated by an AI system and may be inaccurate."
    rate_limit:
      rpm: 60
      tpm: 100000
    budget:
      daily_limit_usd: 50.0
      monthly_limit_usd: 500.0
    priority: high

  - name: team-b
    api_key: "sk-team-b-demo-key"
    allowed_models: ["gpt-4o-mini"]
    policy:
      banned_keywords: ["project-nightingale"]
    rate_limit:
      rpm: 5
      tpm: 2000
    budget:
      daily_limit_usd: 1.0
      monthly_limit_usd: 10.0
    priority: standard

  - name: team-c
    api_key: "sk-team-c-demo-key"
    allowed_models: ["gpt-4o-mini", "claude-3-5-sonnet"]
    allowed_providers: ["openai"]
    priority: low

  - name: gemini-team
    api_key: "sk-gemini-team-demo-key"
    allowed_models: ["gemini-3.6-flash", "gemini-3.5-flash", "gemini-3.5-pro"]
    allowed_providers: ["gemini"]
    rate_limit:
      rpm: 10
      tpm: 50000
    budget:
      daily_limit_usd: 10.0
      monthly_limit_usd: 100.0
    priority: standard

  - name: team-alpha
    api_key: "team-alpha-key"
    allowed_models: ["gemini-3.6-flash", "gemini-3.5-flash", "gemini-3.5-pro"]
    allowed_providers: ["gemini"]
    rate_limit:
      rpm: 100
      tpm: 100000
    budget:
      daily_limit_usd: 50.0
      monthly_limit_usd: 500.0
    priority: high

models:
  gemini-3.6-flash:
    provider: gemini
    provider_model: gemini-3.6-flash
    fallback_chain: ["gemini-3.5-flash"]
  
  gemini-3.5-flash:
    provider: gemini
    provider_model: gemini-3.5-flash
    fallback_chain: ["gpt-4o-mini"]
  
  gemini-3.5-pro:
    provider: gemini
    provider_model: gemini-3.5-pro
    fallback_chain: ["gemini-3.6-flash"]
  
  gpt-4o-mini:
    provider: openai
    provider_model: gpt-4o-mini
    fallback_chain: ["gemini-3.5-flash"]
  
  claude-3-5-sonnet:
    provider: anthropic
    provider_model: claude-3-5-sonnet-20241022
    fallback_chain: ["gemini-3.6-flash"]
  
  llama3:
    provider: ollama
    provider_model: llama3
    fallback_chain: ["gemini-3.6-flash"]

providers:
  openai:
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
    timeout: 30
  
  anthropic:
    base_url: "https://api.anthropic.com/v1"
    api_key_env: "ANTHROPIC_API_KEY"
    timeout: 30
  
  ollama:
    base_url: "http://localhost:11434"
    timeout: 30
  
  gemini:
    base_url: "https://generativelanguage.googleapis.com/v1beta"
    api_key_env: "GEMINI_API_KEY"
    timeout: 60

pricing:
  gemini-3.6-flash:
    input_cost_per_1k: 0.0015
    output_cost_per_1k: 0.0075
  gemini-3.5-flash:
    input_cost_per_1k: 0.0006
    output_cost_per_1k: 0.0024
  gemini-3.5-pro:
    input_cost_per_1k: 0.00125
    output_cost_per_1k: 0.0050
  gpt-4o-mini:
    input_cost_per_1k: 0.00015
    output_cost_per_1k: 0.0006
  claude-3-5-sonnet:
    input_cost_per_1k: 0.003
    output_cost_per_1k: 0.015
  llama3:
    input_cost_per_1k: 0.0
    output_cost_per_1k: 0.0

admission:
  max_concurrent_requests: 10
  max_wait_seconds:
    high: 30.0
    standard: 10.0
    low: 2.0

health_check:
  interval_seconds: 15.0
  timeout_seconds: 3.0
  window_size: 20
  consecutive_failures_for_down: 3
  degraded_error_rate: 0.2
  degraded_latency_ms: 3000.0

retry_policy:
  max_retries: 3
  backoff_base_seconds: 0.25
  backoff_max_seconds: 4.0

circuit_breaker:
  failure_threshold: 3
  cooldown_seconds: 10.0
  half_open_max_trials: 1