# Prometheus scrape config for the docker-compose demo stack. Unlike
# deploy/prometheus/prometheus.yml (standalone Prometheus reaching a
# gateway on the host via host.docker.internal), this one runs inside the
# same compose network as the gateway, so the plain service name works.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "llm-gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000"]
