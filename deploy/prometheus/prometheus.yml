# Prometheus scrape config for the LLM Gateway (Step 15).
#
# `host.docker.internal` lets a Prometheus container reach the gateway
# running on the host machine (see deploy/README.md for the exact `docker
# run` flags needed to make that hostname resolve on Linux). If you're
# running Prometheus natively instead of in Docker, change the target to
# `localhost:8000`.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["host.docker.internal:9093"]

scrape_configs:
  - job_name: "llm-gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
