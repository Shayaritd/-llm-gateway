# Alertmanager config (Step 16).
#
# Slack webhook comes from the SLACK_WEBHOOK_URL environment variable, NOT
# hardcoded here - Alertmanager's own YAML has no env-var interpolation
# built in, so `api_url_file` (a file path, not the URL itself) is the
# idiomatic way to keep this config static while the actual secret stays
# env-var-driven: docker-compose.yml's alertmanager service writes
# $SLACK_WEBHOOK_URL to that file at container start (see its `command:`),
# using plain shell redirection - works on any base image, no extra
# tooling (envsubst etc.) required. Setting the env var in a repo-root
# .env file is the same pattern already used for OPENAI_API_KEY /
# ANTHROPIC_API_KEY since Step 1.
#
# Local-demo-friendly default: if you don't set SLACK_WEBHOOK_URL at all,
# docker-compose.yml defaults it to the bundled mock Slack receiver
# (deploy/alertmanager/mock_slack_receiver.py) so `docker compose up` just
# works and you can see real alert payloads logged, without needing a
# real Slack workspace. Point it at a real Slack incoming-webhook URL to
# get real notifications instead.

route:
  receiver: "slack"
  group_by: ["alertname", "team", "model", "provider"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: "slack"
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_url
        channel: "#llm-gateway-alerts"
        send_resolved: true
        title: '{{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}'
