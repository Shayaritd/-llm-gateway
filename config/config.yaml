# Static config for Step 1 (Later: hot-reload watcher will re-read this file on change)

redis:
  url: "redis://localhost:6379/0"

# Admin API identities (app/routers/admin.py). Separate key space from
# teams - see app/middleware/auth.py and app/http_auth.py.
admins:
  - name: "platform-admin"
    api_key: "sk-admin-demo-key"

teams:
  - name: team-a
    api_key: "sk-team-a-demo-key"
    allowed_models: ["gpt-4o-mini", "claude-3-5-sonnet", "llama3"]
    # allowed_providers omitted -> no extra provider-level restriction
    policy:
      system_prompt: "You are Team A's assistant. Always answer concisely."
      disclaimer: "This response was generated by an AI system and may be inaccurate."
    rate_limit:
      rpm: 60
      tpm: 100000
    budget:
      daily_limit_usd: 50.0
      monthly_limit_usd: 500.0
    priority: high
  - name: team-b
    api_key: "sk-team-b-demo-key"
    allowed_models: ["gpt-4o-mini"]
    policy:
      banned_keywords: ["project-nightingale"]
    # Deliberately tight, to make rate limiting easy to demo locally.
    rate_limit:
      rpm: 5
      tpm: 2000
    budget:
      daily_limit_usd: 1.0
      monthly_limit_usd: 10.0
    priority: standard
  - name: team-c
    api_key: "sk-team-c-demo-key"
    # allowed_models permits both, but allowed_providers below blocks
    # anthropic anyway - demonstrates the two restrictions are independent.
    allowed_models: ["gpt-4o-mini", "claude-3-5-sonnet"]
    allowed_providers: ["openai"]
    # policy, rate_limit, budget all omitted -> no policy injection, no
    # throttling, no spend cap. Useful as an "unrestricted" demo team.
    priority: low

# Logical model name -> provider + provider-specific model id
models:
  gpt-4o-mini:
    provider: openai
    provider_model: gpt-4o-mini
    fallback_chain: ["claude-3-5-sonnet"]
  claude-3-5-sonnet:
    provider: anthropic
    provider_model: claude-3-5-sonnet-20241022
    fallback_chain: ["gpt-4o-mini"]
  llama3:
    provider: ollama
    provider_model: llama3
    # no fallback_chain - local-only, nothing sensible to fall back to

providers:
  openai:
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
  anthropic:
    base_url: "https://api.anthropic.com/v1"
    api_key_env: "ANTHROPIC_API_KEY"
  ollama:
    base_url: "http://localhost:11434"

# USD cost per 1,000 tokens, keyed by logical model name above. A model with
# no entry here is simply not tracked against budget (cost always 0).
pricing:
  gpt-4o-mini:
    input_cost_per_1k: 0.00015
    output_cost_per_1k: 0.0006
  claude-3-5-sonnet:
    input_cost_per_1k: 0.003
    output_cost_per_1k: 0.015
  llama3:
    input_cost_per_1k: 0.0
    output_cost_per_1k: 0.0

# Bounded concurrency for outbound provider calls, with priority scheduling
# when the gateway is at capacity. See app/admission.py.
admission:
  max_concurrent_requests: 10
  max_wait_seconds:
    high: 30.0
    standard: 10.0
    low: 2.0

# Background provider-model health probes. See app/health.py.
health_check:
  interval_seconds: 15.0
  timeout_seconds: 3.0
  window_size: 20
  consecutive_failures_for_down: 3
  degraded_error_rate: 0.2
  degraded_latency_ms: 3000.0

# Per-candidate retry policy, used by both the primary attempt and each
# fallback candidate in its chain. See app/retry.py and app/fallback.py.
retry_policy:
  max_retries: 3
  backoff_base_seconds: 0.25
  backoff_max_seconds: 4.0

# Per-model circuit breaker: protects a struggling/down provider from
# continued load. See app/circuit_breaker.py.
circuit_breaker:
  failure_threshold: 3
  cooldown_seconds: 10.0
  half_open_max_trials: 1
